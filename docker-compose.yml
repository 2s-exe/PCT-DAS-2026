services:
  db:
    image: mysql:8.1
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      # Use MYSQL_ROOT_PASSWORD to control root credentials.
      # If you want a non-root user, set MYSQL_USER and MYSQL_PASSWORD
      # to a different username than 'root'.
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./PctBackend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - '8000:8000'
    volumes:
      - ./PctBackend:/var/www/html:delegated
      - backend_vendor:/var/www/html/vendor
      - backend_node_modules:/var/www/html/node_modules
    command: bash -lc "if [ ! -f .env ]; then cp .env.example .env; fi && php artisan key:generate --force && sleep 2 && php artisan migrate --force && php artisan db:seed && php -S 0.0.0.0:8000 -t public"

  frontend:
    build:
      context: ./PctFrontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - '3000:3000'
    volumes:
      - ./PctFrontend:/app:delegated
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run build && npm run start"

volumes:
  dbdata:
  backend_vendor:
  backend_node_modules:
  frontend_node_modules:
